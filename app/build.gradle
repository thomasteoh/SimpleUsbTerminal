plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 36
    defaultConfig {
        targetSdkVersion 36
        minSdkVersion 21
        vectorDrawables.useSupportLibrary true

        applicationId "de.kai_morich.simple_usb_terminal"
        // CI passes these from the release tag; local builds keep the defaults
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName project.findProperty('versionName') ?: '1.0'
    }
    signingConfigs {
        release {
            def ks = System.getenv('SIGNING_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SIGNING_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            minifyEnabled false
            // fall back to the debug key so CI still produces an installable APK without secrets
            signingConfig System.getenv('SIGNING_KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    namespace 'de.kai_morich.simple_usb_terminal'
}

dependencies {
    implementation libs.usb.serial.for.android
    implementation libs.androidx.appcompat
    implementation libs.material
}
